services:
  api:
    image: asadullahshehbaz/fastapifullcourse-api:latest
    env_file: .env
    environment:
      REDIS_HOST: redis
    ports:
      - "8000:8000"
    command: ["fastapi", "run", "--port", "8000"]
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7
    command: redis-server --appendonly yes
    volumes:
      - ./redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  celery:
    image: asadullahshehbaz/fastapifullcourse-api:latest
    env_file: .env
    environment:
      REDIS_HOST: redis
    command: ["celery", "-A", "app.worker.tasks", "worker", "--loglevel=info"]
    depends_on:
      redis:
        condition: service_healthy